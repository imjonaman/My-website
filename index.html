<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header -->
  <header>
    <nav class="navbar">
      <h1 class="logo">My Portfolio</h1>
      <button class="menu-toggle">☰</button>
      <ul class="nav-links">
        <li><a href="#about">About</a></li>
        <li><a href="#projects">Projects</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <!-- About Section -->
  <section id="about">
    <h2>About Me</h2>
    <p>Hello! I’m a web developer passionate about building clean and user-friendly websites.</p>
    <img src="profile.jpg" alt="My profile picture" class="profile-pic">
  </section>

  <!-- Projects Section -->
  <section id="projects">
    <h2>My Projects</h2>
    <div class="filter">
      <button data-filter="all">All</button>
      <button data-filter="web">Web</button>
      <button data-filter="app">App</button>
    </div>
    <div class="project-grid">
      <div class="project-card" data-category="web">
        <h3>Portfolio Website</h3>
        <p>A personal portfolio built with HTML, CSS, and JS.</p>
      </div>
      <div class="project-card" data-category="app">
        <h3>To-Do App</h3>
        <p>A simple app to track tasks.</p>
      </div>
    </div>
  </section>

  <!-- Contact Section -->
  <section id="contact">
    <h2>Contact Me</h2>
    <form>
      <input type="text" placeholder="Your Name" required>
      <input type="email" placeholder="Your Email" required>
      <textarea placeholder="Your Message" required></textarea>
      <button type="submit">Send</button>
    </form>
  </section>

  <script src="script.js"></script>
</body>
</html>
